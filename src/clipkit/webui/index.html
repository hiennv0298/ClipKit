<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipKit</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg: #0b0d14; --surface: #131722; --surface-2: #1a1f2d; --border: #252c3d; --border-2: #323a4f;
    --text: #e8ebf3; --muted: #8b93a8; --faint: #5d6579;
    --accent: #6d5dfc; --accent-2: #9b5cf6; --accent-soft: rgba(109, 93, 252, .16);
    --ok: #22c55e; --warn: #f5b942; --bad: #f05d5d;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { min-height: 100vh; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 14px 28px; background: rgba(11, 13, 20, .85); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); }
  .logo { width: 32px; height: 32px; display: block; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; cursor: pointer; }
  .ver { color: var(--faint); font-size: 12px; }
  .spacer { flex: 1; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px;
    padding: 0 16px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface-2);
    cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; }
  .btn:hover { background: #222838; border-color: #3d4660; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 600;
    box-shadow: 0 6px 20px rgba(109, 93, 252, .28); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.big { height: 46px; padding: 0 22px; font-size: 15px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--surface-2); }
  .btn.small { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
  .btn.danger { color: #ffb4b4; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .hero { padding: 30px; background:
      radial-gradient(900px 260px at 0% 0%, rgba(109, 93, 252, .20), transparent 60%),
      radial-gradient(700px 240px at 100% 0%, rgba(155, 92, 246, .12), transparent 60%), var(--surface); }
  .hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.2px; }
  .hero p { margin: 0 0 22px; color: var(--muted); }
  .source-row { display: flex; gap: 10px; }
  .input { width: 100%; height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-2);
    background: #0e1119; outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input.sm { height: 34px; padding: 0 10px; border-radius: 8px; }
  .num { width: 64px; text-align: center; }

  .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 18px; }
  .opt { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .opt b { color: var(--text); font-weight: 500; }
  select.input { padding-right: 28px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #0e1119; border: 1px solid var(--border-2); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent;
    color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }
  .more { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border-2);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
  .field label { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; grid-column: 1 / -1; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); user-select: none; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint { color: var(--faint); font-size: 12.5px; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px; }
  .link:hover { color: var(--text); }

  .section-head { display: flex; align-items: center; gap: 12px; margin: 34px 0 14px; }
  .section-head h2 { margin: 0; font-size: 17px; }
  .count { color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .project { overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s; }
  .project:hover { transform: translateY(-2px); border-color: var(--border-2); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #0e1119 center / cover no-repeat; }
  .badge { position: absolute; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.72); font-size: 12px; }
  .thumb .badge { right: 8px; bottom: 8px; }
  .project .body { padding: 12px 14px 14px; }
  .project .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 40px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; border: 1px solid var(--border-2); color: var(--muted); }
  .pill.ok { color: #86efac; border-color: rgba(34, 197, 94, .35); background: rgba(34, 197, 94, .08); }
  .pill.warn { color: #fcd57a; border-color: rgba(245, 185, 66, .35); background: rgba(245, 185, 66, .08); }
  .pill.accent { color: #c4bcff; border-color: rgba(109, 93, 252, .45); background: var(--accent-soft); }
  .empty { padding: 40px; text-align: center; color: var(--muted); border-style: dashed; }

  .banner { margin-top: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
  .banner .bar { flex: 1; }

  /* project page */
  .back { margin-bottom: 14px; }
  .proj-head { display: flex; gap: 20px; align-items: flex-start; }
  .proj-head h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; }
  .progress { margin-top: 18px; padding: 18px 20px; }
  .steps { display: flex; gap: 8px; margin-bottom: 14px; }
  .step { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }
  .step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    border: 1px solid var(--border-2); flex: none; }
  .step.active { color: var(--text); }
  .step.active .dot { border-color: var(--accent); background: var(--accent-soft); color: #c4bcff; }
  .step.done { color: var(--muted); }
  .step.done .dot { border-color: transparent; background: var(--ok); color: #05210f; }
  .bar { height: 8px; border-radius: 99px; background: #0e1119; overflow: hidden; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
  .status-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .status { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .error { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(240, 93, 93, .1);
    border: 1px solid rgba(240, 93, 93, .35); color: #ffc9c9; white-space: pre-wrap; font-size: 13px;
    max-height: 200px; overflow: auto; }
  pre.log { margin: 12px 0 0; padding: 12px; max-height: 220px; overflow: auto; border-radius: 10px;
    background: #0a0c12; border: 1px solid var(--border); color: #aab2c5; font: 12px/1.5 Consolas, monospace; }

  #moments { margin-top: 24px; }
  .toolbar { position: sticky; top: 59px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    margin: 0 0 16px; padding: 12px 0; background: var(--bg); }
  .toolbar h2 { margin: 0; font-size: 17px; }

  .moments { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
  .moment { overflow: hidden; display: flex; flex-direction: column; transition: opacity .2s, border-color .2s; }
  .moment.off { opacity: .5; }
  .moment.off:hover { opacity: .8; }
  .media { position: relative; aspect-ratio: 9 / 16; background: #07080c; overflow: hidden; }
  .media .blur { position: absolute; inset: -20px; background: center / cover no-repeat; filter: blur(18px) brightness(.55); }
  .media img.fg { position: absolute; left: 0; top: 50%; width: 100%; transform: translateY(-50%); }
  .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .media .rank { left: 10px; top: 10px; font-weight: 600; }
  .media .dur { right: 10px; top: 10px; }
  .media .state { left: 10px; bottom: 10px; }
  .play { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border: 0;
    border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: rgba(0,0,0,.55);
    box-shadow: 0 0 0 2px rgba(255,255,255,.75) inset; transition: transform .15s, background .15s; }
  .play:hover { transform: scale(1.08); background: rgba(109, 93, 252, .85); }
  .media video.preview { top: 50%; bottom: auto; height: auto; transform: translateY(-50%); object-fit: contain;
    background: transparent; }
  .use { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 8px; background: rgba(0,0,0,.72); cursor: pointer; font-size: 12.5px; user-select: none; }
  .use input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .moment .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  textarea.title { width: 100%; resize: none; border: 1px solid transparent; border-radius: 8px; background: transparent;
    padding: 6px 8px; margin: -6px -8px 0; width: calc(100% + 16px); font-weight: 600; line-height: 1.35; outline: none; }
  textarea.title:hover { border-color: var(--border-2); }
  textarea.title:focus { border-color: var(--accent); background: #0e1119; }
  .times { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .times input { width: 70px; height: 28px; padding: 0 6px; text-align: center; border-radius: 7px;
    border: 1px solid var(--border-2); background: #0e1119; outline: none; font-size: 12.5px; }
  .times input:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .excerpt { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer; }
  .excerpt.open { -webkit-line-clamp: unset; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: auto; padding-top: 4px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0;
    padding: 10px 16px; border-radius: 10px; background: #232a3b; border: 1px solid var(--border-2);
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: 80vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: #3a1d22; border-color: rgba(240, 93, 93, .5); }
  .skeleton { aspect-ratio: 9 / 16; border-radius: var(--radius); border: 1px solid var(--border);
    background: linear-gradient(100deg, var(--surface) 40%, #1b2030 50%, var(--surface) 60%) 0 0 / 300% 100%;
    animation: shimmer 1.6s infinite linear; }
  @keyframes shimmer { to { background-position: -150% 0; } }

  .verbtn { background: none; border: 1px solid transparent; border-radius: 7px; padding: 2px 7px; color: var(--faint);
    font-size: 12px; cursor: pointer; }
  .verbtn:hover { color: var(--text); border-color: var(--border-2); }
  .verbtn.new { color: #c4bcff; border-color: rgba(109, 93, 252, .45); background: var(--accent-soft); }
  .updbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px max(28px, calc((100% - 1184px) / 2)) 0;
    padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(109, 93, 252, .45);
    background: linear-gradient(90deg, rgba(109, 93, 252, .18), rgba(155, 92, 246, .08)); }
  .updbar b { font-weight: 600; }
  .backdrop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
    background: rgba(3, 4, 8, .7); backdrop-filter: blur(3px); }
  .modal { width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column; padding: 22px 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,.55); }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .modal .sub { color: var(--muted); margin-bottom: 14px; }
  .notes { overflow: auto; padding-right: 6px; color: #cdd3e1; }
  .notes h3, .notes h4 { margin: 14px 0 6px; font-size: 15px; color: var(--text); }
  .notes ul { margin: 6px 0; padding-left: 20px; }
  .notes li { margin: 5px 0; }
  .notes p { margin: 8px 0; }
  .notes code, .cmd { font: 12.5px Consolas, monospace; background: #0a0c12; border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 5px; }
  .cmd { display: block; padding: 10px 12px; margin: 6px 0 12px; white-space: pre-wrap; word-break: break-all; }
  .modal .foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; }
  @media (max-width: 640px) { main { padding: 16px; } .source-row { flex-direction: column; } header { padding: 12px 16px; }
    .ver { display: none; } .toolbar { top: 55px; } }
  header .btn { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  body { overflow-x: hidden; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/icon-192.png" alt="" width="30" height="30">
  <div class="brand" onclick="go('#/')">ClipKit</div>
  <button class="verbtn" id="ver" title="Check for updates" onclick="openUpdates(true)"></button>
  <div class="spacer"></div>
  <button class="btn ghost small" onclick="api('/api/open', {})">Open output folder</button>
</header>
<div id="updbar" hidden></div>
<main id="view"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
let S = { settings: null, state: {}, project: null, projects: [], route: "" };
let pollTimer = null, saveTimer = null, lastPhase = "", lastProjectStamp = "";

// ---------- helpers
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "value" || (k in el && typeof v !== "string")) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(url, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-ClipKit": "1" },
    body: JSON.stringify(body) };
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) { toast(data.error || `Request failed (${res.status})`, true); throw new Error(data.error); }
  return data;
}
function put(el, ...kids) { el.append(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg.length > 300 ? msg.slice(-300) : msg; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", bad ? 6000 : 2400);
}
const ts = s => { s = Math.max(0, +s); const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`; };
const tsShort = s => { s = Math.max(0, Math.round(+s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
function parseTs(v) { const p = String(v).trim().split(":"); if (!p[0] || p.length > 3) return NaN;
  return p.reduce((t, x) => t * 60 + Number(x), 0); }
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const isCC = lic => /creative commons/i.test(lic || "");
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

// ---------- data
async function loadSettings() { S.settings = await api("/api/settings"); }
async function saveSettings(patch) { Object.assign(S.settings, patch); S.settings = await api("/api/settings", S.settings); }
async function poll() {
  try {
    const st = await (await fetch("/api/state")).json();
    const prev = S.state; S.state = st;
    onState(prev, st);
  } catch (e) { /* app closed */ }
}
function onState(prev, st) {
  const inProject = S.route.startsWith("#/p/");
  if (S.waitingForProject && st.project) { S.waitingForProject = false; go("#/p/" + encodeURIComponent(st.project)); return; }
  if (S.waitingForProject && !st.busy && ["error", "stopped"].includes(st.phase)) {
    S.waitingForProject = false;  // failed before the video was downloaded, e.g. a bad link
    toast(st.error || "Stopped.", !!st.error);
  }
  if (inProject) {
    const pid = decodeURIComponent(S.route.slice(4));
    updateProgress();
    const finished = prev.busy && !st.busy;
    const newMoments = st.project === pid && st.phase !== prev.phase && ["review", "rendering", "done"].includes(st.phase);
    const clipDone = st.project === pid && st.phase === "rendering" && st.status !== prev.status && /done in/.test(st.status);
    const titleReady = !S.project && st.project === pid && st.step >= 2 && !S.projectRequested;
    if (titleReady) S.projectRequested = true;
    if (finished || newMoments || clipDone || titleReady) loadProject(pid);
  } else if (S.route === "#/" || S.route === "") {
    updateBanner();
    if (prev.busy && !st.busy) loadProjects();
  }
}
async function loadProjects() { S.projects = await api("/api/projects"); if (!S.route.startsWith("#/p/")) renderProjects(); }
async function loadProject(pid) {
  try { S.project = await api("/api/project?id=" + encodeURIComponent(pid)); }
  catch (e) { S.project = null; }
  if (S.route === "#/p/" + encodeURIComponent(pid)) renderMoments();
}

// ---------- routing
window.addEventListener("hashchange", render);
function render() {
  S.route = location.hash || "#/";
  const view = $("#view"); view.innerHTML = "";
  if (S.route.startsWith("#/p/")) { const pid = decodeURIComponent(S.route.slice(4)); view.append(projectPage(pid)); S.project = null;
    S.projectRequested = false; loadProject(pid); }
  else { view.append(homePage()); loadProjects(); }
  window.scrollTo(0, 0);
}

// ---------- home
function homePage() {
  const s = S.settings;
  const src = h("input", { class: "input", id: "source", placeholder: "Paste a YouTube, TikTok or Facebook link, or choose a video file",
    onkeydown: e => { if (e.key === "Enter") find(); } });
  const segCtl = (key, items) => h("div", { class: "seg" }, items.map(([v, label]) =>
    h("button", { class: s[key] === v ? "on" : "", onclick: async e => { await saveSettings({ [key]: v });
      [...e.target.parentNode.children].forEach(b => b.classList.toggle("on", b === e.target)); } }, label)));
  const num = (key, min, max, step = 1) => h("input", { class: "input sm num", type: "number", min, max, step, value: s[key],
    onchange: e => saveSettings({ [key]: Number(e.target.value) }) });
  const sel = (key, items) => h("select", { class: "input sm", onchange: e => saveSettings({ [key]: e.target.value }) },
    items.map(([v, label]) => h("option", { value: v, selected: s[key] === v }, label)));
  const chk = (key, label) => h("label", { class: "check" }, h("input", { type: "checkbox", checked: !!s[key],
    onchange: e => saveSettings({ [key]: e.target.checked }) }), label);
  const out = h("input", { class: "input sm", value: s.out, onchange: e => saveSettings({ out: e.target.value }).then(loadProjects) });
  const more = h("div", { class: "more", hidden: !S.showMore },
    h("div", { class: "field" }, h("label", {}, "Speech recognition model"),
      sel("model", [["base", "base · fast, more typos"], ["small", "small · balanced (recommended)"],
        ["medium", "medium · more accurate, ~2× slower"], ["large-v3", "large-v3 · most accurate, very slow"], ["turbo", "turbo · accurate, best with a GPU"]])),
    h("div", { class: "field" }, h("label", {}, "Only process part of the video"),
      h("input", { class: "input sm", placeholder: "e.g. 10:00-25:00 (empty = whole video)", value: s.section,
        onchange: e => saveSettings({ section: e.target.value }) })),
    h("div", { class: "field" }, h("label", {}, "Save clips to"),

let U = null, updTimer = null, updDismissed = false;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function md(text) {  // tiny Markdown subset for release notes: headings, bullets, bold, italics, code, links
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", list = false;
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trim(), item = line.match(/^[-*]\s+(.*)$/);
    if (item) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(item[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    const head = line.match(/^(#{1,4})\s+(.*)$/);
    if (head) html += head[1].length <= 2 ? `<h3>${inline(head[2])}</h3>` : `<h4>${inline(head[2])}</h4>`;
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  html += list ? "</ul>" : "";
  return html || "<p>No release notes.</p>";
}
