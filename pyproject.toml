[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipkit"
version = "0.1.0"
description = "Cắt video dài thành clip ngắn 9:16 có phụ đề bằng yt-dlp, Whisper và FFmpeg — không cần API key."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
clipkit = "clipkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
