[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipkit"
version = "0.2.0"
description = "Cut long videos into captioned 9:16 short clips with yt-dlp, Whisper and FFmpeg - no API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
clipkit = "clipkit.cli:main"

[project.gui-scripts]
clipkit-gui = "clipkit.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipkit = ["webui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
